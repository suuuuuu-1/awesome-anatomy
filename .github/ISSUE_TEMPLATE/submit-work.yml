name: Suggest an Anatomy work
description: Send an original Anatomy work link. Other details are optional.
title: "Add: "
body:
  - type: input
    id: title
    attributes:
      label: Work title
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: Original source URL
      description: Link to the creator's original post, page or repository.
    validations:
      required: true
  - type: input
    id: creator
    attributes:
      label: Original creator
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Description and optional resources
      description: Optional. Tell us what it shows, how it uses Anatomy, and any demo, code or public prompt links you have.
    validations:
      required: false
